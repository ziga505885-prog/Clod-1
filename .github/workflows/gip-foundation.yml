name: GIP Foundation

on:
  push:
    paths:
      - ".gip/**"
  pull_request:
    paths:
      - ".gip/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Test GIP foundation
        working-directory: .gip
        run: pytest -q
